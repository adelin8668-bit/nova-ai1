<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
    }

    header {
      height: 65px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: #11182b;
      border-bottom: 1px solid #26314a;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 21px;
      font-weight: bold;
    }

    .icon {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
    }

    #clear {
      padding: 9px 13px;
      border-radius: 10px;
      border: 1px solid #34405c;
      background: #192239;
      color: white;
      cursor: pointer;
    }

    #chat {
      height: calc(100vh - 145px);
      overflow-y: auto;
      padding: 25px 15px 100px;
    }

    #messages {
      max-width: 850px;
      margin: auto;
    }

    .message {
      display: flex;
      gap: 10px;
      margin: 18px 0;
      align-items: flex-start;
    }

    .message.user {
      justify-content: flex-end;
    }

    .avatar {
      width: 36px;
      height: 36px;
      min-width: 36px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      background: #202b45;
    }

    .user .avatar {
      order: 2;
    }

    .bubble {
      max-width: 75%;
      padding: 13px 16px;
      border-radius: 16px;
      line-height: 1.55;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .ai .bubble {
      background: #151e33;
      border: 1px solid #293650;
    }

    .user .bubble {
      background: #2563eb;
    }

    .bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 15px;
      background: #0b1020;
    }

    .input-box {
      max-width: 850px;
      margin: auto;
      display: flex;
      gap: 10px;
      padding: 10px;
      background: #121b30;
      border: 1px solid #293650;
      border-radius: 17px;
    }

    textarea {
      flex: 1;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      font-size: 16px;
      padding: 10px;
      min-height: 45px;
      max-height: 150px;
    }

    #send {
      width: 45px;
      height: 45px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    #send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .welcome {
      text-align: center;
      margin-top: 20vh;
      color: #94a3b8;
    }

    .welcome h1 {
      color: white;
      font-size: 35px;
    }

    .typing {
      opacity: 0.7;
    }
  </style>
</head>

<body>

<header>

  <div class="logo">
    <div class="icon">✦</div>
    Nova AI
  </div>

  <button id="clear">
    Șterge chatul
  </button>

</header>


<div id="chat">

  <div id="messages">

    <div class="welcome">
      <h1>Salut! 👋</h1>
      <p>Eu sunt Nova AI. Scrie-mi un mesaj.</p>
    </div>

  </div>

</div>


<div class="bottom">

  <div class="input-box">

    <textarea
      id="input"
      placeholder="Scrie un mesaj..."
      rows="1"
    ></textarea>

    <button id="send">
      ➤
    </button>

  </div>

</div>


<script>

const input = document.getElementById("input");
const send = document.getElementById("send");
const messages = document.getElementById("messages");
const clear = document.getElementById("clear");


// Istoricul conversației
let history = JSON.parse(
  localStorage.getItem("novaAI_history") || "[]"
);


// ------------------------------------
// Afișare mesaje
// ------------------------------------

function renderMessages() {

  messages.innerHTML = "";

  if (history.length === 0) {

    messages.innerHTML = `
      <div class="welcome">
        <h1>Salut! 👋</h1>
        <p>Eu sunt Nova AI. Scrie-mi un mesaj.</p>
      </div>
    `;

    return;
  }


  history.forEach(message => {

    createMessage(
      message.role,
      message.content,
      false
    );

  });

  scrollBottom();
}


// ------------------------------------
// Creează mesaj
// ------------------------------------

function createMessage(
  role,
  content,
  save = true
) {

  const row = document.createElement("div");

  row.className =
    "message " +
    (role === "user" ? "user" : "ai");


  const avatar =
    document.createElement("div");

  avatar.className = "avatar";

  avatar.textContent =
    role === "user"
      ? "👤"
      : "✦";


  const bubble =
    document.createElement("div");

  bubble.className = "bubble";

  bubble.textContent = content;


  row.appendChild(avatar);
  row.appendChild(bubble);

  messages.appendChild(row);


  if (save) {

    history.push({
      role: role,
      content: content
    });

    saveHistory();
  }


  scrollBottom();

  return bubble;
}


// ------------------------------------
// Salvează conversația
// ------------------------------------

function saveHistory() {

  localStorage.setItem(
    "novaAI_history",
    JSON.stringify(history)
  );

}


// ------------------------------------
// Trimite mesajul către SERVER
// ------------------------------------

async function sendMessage() {

  const text = input.value.trim();

  if (!text) return;


  input.value = "";

  input.style.height = "45px";

  send.disabled = true;


  createMessage(
    "user",
    text
  );


  const thinking =
    createMessage(
      "assistant",
      "Se gândește...",
      false
    );


  thinking.classList.add("typing");


  try {

    const response = await fetch(
      "/api/chat",
      {
        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({

          message: text,

          history: history

        })

      }
    );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Serverul a returnat o eroare."
      );

    }


    thinking.classList.remove(
      "typing"
    );


    thinking.textContent =
      data.reply;


    history.push({

      role: "assistant",

      content: data.reply

    });


    saveHistory();


  } catch (error) {

    thinking.classList.remove(
      "typing"
    );


    thinking.textContent =
      "❌ Nu am putut contacta AI-ul.\n\n" +
      error.message;

  }


  send.disabled = false;

  input.focus();

  scrollBottom();

}


// ------------------------------------
// Enter = trimite
// Shift + Enter = rând nou
// ------------------------------------

input.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);


// ------------------------------------
// Buton trimitere
// ------------------------------------

send.addEventListener(
  "click",
  sendMessage
);


// ------------------------------------
// Auto-resize textarea
// ------------------------------------

input.addEventListener(
  "input",
  () => {

    input.style.height = "45px";

    input.style.height =
      Math.min(
        input.scrollHeight,
        150
      ) + "px";

  }
);


// ------------------------------------
// Ștergere conversație
// ------------------------------------

clear.addEventListener(
  "click",
  () => {

    history = [];

    localStorage.removeItem(
      "novaAI_history"
    );

    renderMessages();

  }
);


// ------------------------------------
// Scroll
// ------------------------------------

function scrollBottom() {

  const chat =
    document.getElementById("chat");

  setTimeout(() => {

    chat.scrollTop =
      chat.scrollHeight;

  }, 50);

}


renderMessages();

</script>

</body>
</html>
